<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>GAZE 예약 완료</title>

    <style>
        /* ========================================
           기본 설정
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            background-color: #f7f4ee;
            color: #1f2a44;

            font-family:
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                "Malgun Gothic",
                sans-serif;

            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        img,
        svg {
            display: block;
        }

        /* ========================================
           전체 화면
        ======================================== */
        .complete-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            background-color: #f7f4ee;
        }

        .complete-content {
            width: 100%;
            max-width: 440px;
            min-height: 100svh;

            margin: 0 auto;

            padding:
                max(32px, calc(env(safe-area-inset-top) + 16px))
                24px
                calc(32px + env(safe-area-inset-bottom));
        }

        /* ========================================
           헤더
        ======================================== */
        .page-header {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 44px;
        }

        .back-button {
            position: absolute;
            top: 0;
            left: -12px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;

            border: 0;
            background-color: transparent;

            cursor: pointer;
        }

        .back-icon {
            width: 24px;
            height: 24px;

            fill: none;
            stroke: #1f2a44;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            color: #1f2a44;

            font-size: 16px;
            font-weight: 700;
            line-height: 24px;
            letter-spacing: -0.3px;
        }

        /* ========================================
           완료 메시지
        ======================================== */
        .complete-message {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;

            margin-top: 16px;

            text-align: center;
        }

        .complete-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            background-color: #1f2a44;
        }

        .complete-icon {
            width: 28px;
            height: 28px;

            fill: none;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .complete-title {
            margin-top: 16px;

            color: #1f2a44;

            font-size: 22px;
            font-weight: 700;
            line-height: 32px;
            letter-spacing: -0.7px;
        }

        .complete-description {
            margin-top: 8px;

            color: #2f3640;

            font-size: 13px;
            font-weight: 500;
            line-height: 20px;
        }

        /* ========================================
           예약 제품 카드
        ======================================== */
        .reservation-card {
            display: grid;
            grid-template-columns: 124px minmax(0, 1fr);
            align-items: center;

            width: 100%;
            min-height: 168px;

            margin-top: 16px;
            padding: 16px;

            gap: 12px;

            border: 1px solid #d8dde5;
            border-radius: 16px;

            background-color: #ffffff;
        }

        .product-image-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 124px;
            height: 96px;

            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;
        }

        .reservation-info {
            min-width: 0;
        }

        .product-name {
            color: #1f2a44;

            font-size: 15px;
            font-weight: 700;
            line-height: 22px;
        }

        .product-price {
            margin-top: 2px;

            color: #1f2a44;

            font-size: 14px;
            font-weight: 700;
            line-height: 20px;
        }

        .detail-list {
            display: flex;
            flex-direction: column;

            margin-top: 8px;

            gap: 8px;
        }

        .detail-item {
            display: grid;
            grid-template-columns: 20px minmax(0, 1fr);
            align-items: center;

            gap: 8px;
        }

        .detail-icon {
            width: 20px;
            height: 20px;

            fill: none;
            stroke: #1f2a44;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .detail-text {
            min-width: 0;

            overflow: hidden;

            color: #2f3640;

            font-size: 11px;
            font-weight: 500;
            line-height: 16px;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ========================================
           예약 부가 정보
        ======================================== */
        .reservation-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));

            width: 100%;

            margin-top: 32px;

            border: 1px solid #d8dde5;
            border-radius: 16px;

            background-color: #ffffff;

            overflow: hidden;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            min-width: 0;
            min-height: 88px;

            padding: 10px 4px 8px;

            text-align: center;
        }

        .summary-item + .summary-item {
            border-left: 1px dashed #d8dde5;
        }

        .summary-icon {
            width: 30px;
            height: 30px;

            fill: none;
            stroke: #1f2a44;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .summary-label {
            margin-top: 6px;

            color: #2f3640;

            font-size: 11px;
            font-weight: 500;
            line-height: 16px;
        }

        .summary-value {
            margin-top: 4px;

            color: #1f2a44;

            font-size: 11px;
            font-weight: 700;
            line-height: 16px;

            word-break: keep-all;
        }

        /* ========================================
           하단 버튼
        ======================================== */
        .action-area {
            display: flex;
            flex-direction: column;

            width: 100%;

            margin-top: 56px;

            gap: 8px;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 56px;

            border-radius: 12px;

            font-size: 15px;
            font-weight: 700;
            line-height: 22px;

            cursor: pointer;
        }

        .history-button {
            border: 1px solid #1f2a44;

            background-color: #ffffff;
            color: #1f2a44;
        }

        .store-button {
            border: 1px solid #1f2a44;

            background-color: #1f2a44;
            color: #ffffff;
        }

        .home-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 48px;

            margin-top: 8px;

            color: #1f2a44;

            font-size: 14px;
            font-weight: 700;
            line-height: 20px;
        }

        /* 터치 효과 */
        .back-button:active,
        .action-button:active,
        .home-button:active {
            opacity: 0.75;
        }

        @media (max-height: 760px) {
            .complete-title {
                margin-top: 12px;
            }

            .reservation-summary {
                margin-top: 20px;
            }

            .action-area {
                margin-top: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="complete-page">

        <div class="complete-content">

            <!-- 상단 헤더 -->
            <header class="page-header">

                <button
                    class="back-button"
                    type="button"
                    aria-label="이전 화면으로 돌아가기"
                    onclick="
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = './fitting-reservation.html';
                        }
                    "
                >
                    <svg
                        class="back-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M15 5L8 12L15 19"></path>
                    </svg>
                </button>

                <h1 class="page-title">
                    예약 완료
                </h1>

            </header>

            <!-- 완료 메시지 -->
            <section class="complete-message">

                <div class="complete-icon-box">

                    <svg
                        class="complete-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M5 12.5L10 17L19 7"></path>
                    </svg>

                </div>

                <h2 class="complete-title">
                    피팅 예약이 완료되었어요
                </h2>

                <p class="complete-description">
                    예약 정보와 매장 위치를 확인하고<br>
                    편하게 방문해보세요.
                </p>

            </section>

            <!-- 예약 제품 및 예약 정보 -->
            <section class="reservation-card">

                <div class="product-image-box">

                    <img
                        class="product-image"
                        src="./images/17.png"
                        alt="라운드 프레임 선글라스"
                    >

                </div>

                <div class="reservation-info">

                    <h3 class="product-name">
                        ROUND FRAME
                    </h3>

                    <p class="product-price">
                        ₩290,000
                    </p>

                    <div class="detail-list">

                        <!-- 매장 -->
                        <div class="detail-item">

                            <svg
                                class="detail-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path d="M3 10L12 3L21 10"></path>
                                <path d="M5 9V21H19V9"></path>
                                <path d="M9 21V14H15V21"></path>
                            </svg>

                            <span class="detail-text">
                                GAZE Optical 강남점
                            </span>

                        </div>

                        <!-- 날짜 및 시간 -->
                        <div class="detail-item">

                            <svg
                                class="detail-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <rect x="3" y="5" width="18" height="16" rx="1"></rect>
                                <path d="M7 3V7"></path>
                                <path d="M17 3V7"></path>
                                <path d="M3 10H21"></path>
                                <circle cx="12" cy="15" r="1.5"></circle>
                            </svg>

                            <span
                                class="detail-text"
                                id="reservationDate"
                            >
                                7월 11일 (금) 13:30
                            </span>

                        </div>

                        <!-- 방문자 -->
                        <div class="detail-item">

                            <svg
                                class="detail-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <circle cx="12" cy="7" r="4"></circle>
                                <path d="M5 21V18C5 14.7 8.1 12 12 12C15.9 12 19 14.7 19 18V21"></path>
                            </svg>

                            <span
                                class="detail-text"
                                id="visitorName"
                            >
                                김가은
                            </span>

                        </div>

                    </div>

                </div>

            </section>

            <!-- 예약 정보 요약 -->
            <section
                class="reservation-summary"
                aria-label="예약 정보 요약"
            >

                <!-- 예약 번호 -->
                <article class="summary-item">

                    <svg
                        class="summary-icon"
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                    >
                        <path d="M4 8C6 8 7 6.5 7 5H25C25 6.5 26 8 28 8V24C26 24 25 25.5 25 27H7C7 25.5 6 24 4 24Z"></path>
                        <path d="M16 7V10"></path>
                        <path d="M16 14V18"></path>
                        <path d="M16 22V25"></path>
                    </svg>

                    <p class="summary-label">
                        예약 번호
                    </p>

                    <p
                        class="summary-value"
                        id="reservationNumber"
                    >
                        R-0711-132
                    </p>

                </article>

                <!-- 알림 설정 -->
                <article class="summary-item">

                    <svg
                        class="summary-icon"
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                    >
                        <path d="M24 13C24 7.5 20.4 4 16 4C11.6 4 8 7.5 8 13V19L5 24H27L24 19Z"></path>
                        <path d="M13 27C13.8 28.3 14.8 29 16 29C17.2 29 18.2 28.3 19 27"></path>
                    </svg>

                    <p class="summary-label">
                        알림 설정
                    </p>

                    <p class="summary-value">
                        완료
                    </p>

                </article>

                <!-- 현장 피팅 -->
                <article class="summary-item">

                    <svg
                        class="summary-icon"
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                    >
                        <path d="M5 12H27"></path>
                        <path d="M7 12V28H25V12"></path>
                        <path d="M4 12L7 5H25L28 12"></path>
                        <path d="M10 5L9 12"></path>
                        <path d="M16 5V12"></path>
                        <path d="M22 5L23 12"></path>
                        <path d="M5 12C5 15 9 15 9 12"></path>
                        <path d="M9 12C9 15 13 15 13 12"></path>
                        <path d="M13 12C13 15 17 15 17 12"></path>
                        <path d="M17 12C17 15 21 15 21 12"></path>
                        <path d="M21 12C21 15 27 15 27 12"></path>
                    </svg>

                    <p class="summary-label">
                        현장 피팅
                    </p>

                    <p class="summary-value">
                        가능
                    </p>

                </article>

            </section>

            <!-- 하단 버튼 -->
            <nav
                class="action-area"
                aria-label="예약 완료 메뉴"
            >

                <!-- 15번 마이페이지 예약 내역으로 이동 -->
                <a
                    class="action-button history-button"
                    href="./my.html"
                >
                    예약 내역 보기
                </a>

                <!-- 매장 찾기 -->
                <a
                    class="action-button store-button"
                    href="./store-finder.html"
                >
                    매장 길찾기
                </a>

                <!-- 홈 -->
                <a
                    class="home-button"
                    href="./home.html"
                >
                    홈으로 돌아가기
                </a>

            </nav>

        </div>

    </main>

 <script>
    const params = new URLSearchParams(window.location.search);

    /* 기존에 저장된 예약 불러오기 */
    let savedReservation = null;

    try {
        savedReservation = JSON.parse(
            localStorage.getItem("gazeReservation")
        );
    } catch (error) {
        savedReservation = null;
    }

    /* 피팅 예약 화면에서 넘어온 정보 */
    const queryDate = params.get("visit-date");
    const queryTime = params.get("visit-time");
    const queryName = params.get("visitor-name");
    const queryPhone = params.get("visitor-phone");
    const queryRequest = params.get("request");

    /* 새 예약 정보가 있으면 저장 */
    if (queryDate && queryTime) {
        savedReservation = {
            date: queryDate,
            time: queryTime,
            name: queryName || "",
            phone: queryPhone || "",
            request: queryRequest || "",
            store: "GAZE Optical 강남점",
            status: "예약 확정"
        };

        localStorage.setItem(
            "gazeReservation",
            JSON.stringify(savedReservation)
        );
    }

    const reservationDate =
        document.getElementById("reservationDate");

    const visitorName =
        document.getElementById("visitorName");

    const reservationNumber =
        document.getElementById("reservationNumber");

    const weekdayMap = {
        "7월 9일": "7월 9일 (수)",
        "7월 10일": "7월 10일 (목)",
        "7월 11일": "7월 11일 (금)",
        "7월 12일": "7월 12일 (토)",
        "7월 13일": "7월 13일 (일)",
        "7월 14일": "7월 14일 (월)",
        "7월 15일": "7월 15일 (화)"
    };

    if (savedReservation) {
        const formattedDate =
            weekdayMap[savedReservation.date] ||
            savedReservation.date;

        reservationDate.textContent =
            `${formattedDate} ${savedReservation.time}`.trim();

        visitorName.textContent =
            savedReservation.name || "방문자";

        const dateNumbers =
            savedReservation.date.match(/\d+/g);

        const timeNumbers =
            savedReservation.time.replace(":", "");

        if (dateNumbers && dateNumbers.length >= 2) {
            const month =
                String(dateNumbers[0]).padStart(2, "0");

            const day =
                String(dateNumbers[1]).padStart(2, "0");

            const timeCode =
                timeNumbers.slice(0, 3);

            reservationNumber.textContent =
                `R-${month}${day}-${timeCode}`;
        }
    }

    /* 예약 내역 보기 버튼 */
    const historyButton =
        document.querySelector(".history-button");

    if (historyButton) {
        historyButton.href = "./my.html";
    }
</script>
</body>
</html>

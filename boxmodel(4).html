<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boxmodel4</title>
    <style>
        *{margin: 0; padding: 0;}
        .box{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            display: flex;
            gap: 20px;
            margin: 0 auto;
        }
        .box div{
            width: 245px;
            height: 300px;
            background-color:#f0f8ff;
        }

        ul{ width: 1000px;
            height: 300px;
            border: 5px solid #000;
            display: flex;
            gap: 20px;
            margin: 0 auto;}

            ul li {
                list-style: none;
                width: 245px;
                height: 300px;
                background-color: #ffc0cb;
            }
    </style>
    
</head>
<body>
    <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>

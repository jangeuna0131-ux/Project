<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 앱 전용 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 로그인</title>

    <style>
        /* =========================
           기본 초기화
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;

            background-color: #ffffff;

            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;

            color: #4f6db2;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: 0;
            outline: 0;
            background: none;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           모바일 앱 전체 화면
        ========================= */

        .login-app {
            position: relative;

            width: 100%;
            max-width: 375px;
            min-height: 812px;

            margin: 0 auto;

            background-color: #ffffff;
        }

        /* 로그인 콘텐츠 */
        .login-wrap {
            width: 100%;
            padding: 75px 24px 48px;
        }

        /* =========================
           상단 로고
        ========================= */

        .logo-box {
            display: flex;
            justify-content: center;

            margin-bottom: 45px;
        }

        .logo-box img {
            display: block;

            width: 151px;
            height: auto;
        }

        /* =========================
           입력 영역
        ========================= */

        .login-form {
            width: 100%;
        }

        .input-group {
            width: 100%;
            margin-bottom: 8px;
        }

        .input-label {
            display: block;

            color: #5573ba;

            font-size: 16px;
            font-weight: 600;
            line-height: 24px;
        }

        .line-input {
            width: 100%;
            height: 44px;

            color: #333333;
            background-color: transparent;

            border: 0;
            border-bottom: 1px solid #d8d8d8;
            outline: 0;

            font-size: 16px;
        }

        .line-input:focus {
            border-bottom-color: #5573ba;
        }

        /* =========================
           로그인 버튼
        ========================= */

        .button-group {
            margin-top: 32px;
        }

        .btn {
            display: block;

            width: 100%;
            height: 48px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;
            text-align: center;

            cursor: pointer;
        }

        .btn-login {
            color: #ffffff;
            background-color: #5573ba;
        }

        .btn-login:active {
            background-color: #4966aa;
        }

        .btn-signup {
            margin-top: 8px;

            color: #5573ba;
            background-color: #ffffff;

            border: 1px solid #5573ba;
        }

        /* =========================
           계정 관련 링크
        ========================= */

        .account-links {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-top: 17px;

            color: #526ba8;

            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
        }

        .account-links a {
            white-space: nowrap;
        }

        .divider {
            margin: 0 14px;
            color: #9ca9ca;
        }

        /* =========================
           간편 로그인
        ========================= */

        .social-login {
            margin-top: 34px;
        }

        .social-title {
            display: flex;
            align-items: center;

            width: 100%;
        }

        .social-title::before,
        .social-title::after {
            content: "";

            flex: 1;
            height: 1px;

            background-color: #8da1d0;
        }

        .social-title span {
            margin: 0 14px;

            color: #5573ba;

            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 간편 로그인 아이콘 묶음 */
        .social-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;

            margin-top: 26px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;
        }

        .social-link img {
            display: block;

            width: 24px;
            height: 24px;

            object-fit: contain;
        }
    </style>
</head>

<body>

    <main class="login-app">

        <div class="login-wrap">

            <!-- CAMBAK 로고 -->
            <div class="logo-box">
                <img
                    src="./images/logo.svg"
                    alt="CAMBAK 로고"
                >
            </div>

            <!-- 로그인 입력 폼 -->
            <form class="login-form">

                <!-- 아이디 -->
                <div class="input-group">

                    <label
                        class="input-label"
                        for="userId"
                    >
                        아이디
                    </label>

                    <input
                        class="line-input"
                        type="text"
                        id="userId"
                        name="userId"
                        autocomplete="username"
                    >

                </div>

                <!-- 비밀번호 -->
                <div class="input-group">

                    <label
                        class="input-label"
                        for="userPassword"
                    >
                        비밀번호
                    </label>

                    <input
                        class="line-input"
                        type="password"
                        id="userPassword"
                        name="userPassword"
                        autocomplete="current-password"
                    >

                </div>

                <!-- 로그인 및 회원가입 -->
                <div class="button-group">

                    <button
                        class="btn btn-login"
                        type="button"
                    >
                        로그인
                    </button>

                    <button
                        class="btn btn-signup"
                        type="button"
                    >
                        회원가입
                    </button>

                </div>

            </form>

            <!-- 계정 관련 메뉴 -->
            <nav
                class="account-links"
                aria-label="계정 관련 메뉴"
            >

                <a href="#">아이디 찾기</a>

                <span class="divider">|</span>

                <a href="#">비밀번호 찾기</a>

                <span class="divider">|</span>

                <a href="#">둘러보기</a>

            </nav>

            <!-- 간편 로그인 -->
            <section class="social-login">

                <div class="social-title">
                    <span>간편로그인</span>
                </div>

                <div class="social-icons">

                    <!-- 카카오 -->
                    <a
                        class="social-link"
                        href="#"
                        aria-label="카카오로 로그인"
                    >
                        <img
                            src="./images/kakao.png"
                            alt="카카오"
                        >
                    </a>

                    <!-- 네이버 -->
                    <a
                        class="social-link"
                        href="#"
                        aria-label="네이버로 로그인"
                    >
                        <img
                            src="./images/naver.png"
                            alt="네이버"
                        >
                    </a>

                    <!-- 구글 -->
                    <a
                        class="social-link"
                        href="#"
                        aria-label="구글로 로그인"
                    >
                        <img
                            src="./images/google.png"
                            alt="구글"
                        >
                    </a>

                    <!-- 페이스북 -->
                    <a
                        class="social-link"
                        href="#"
                        aria-label="페이스북으로 로그인"
                    >
                        <img
                            src="./images/facebook.png"
                            alt="페이스북"
                        >
                    </a>

                </div>

            </section>

        </div>

    </main>

</body>
</html>

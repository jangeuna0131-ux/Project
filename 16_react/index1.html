<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html5form</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
   <h1>입력 요소의 종류와 속성</h1>
   <!-- 사용자로부터 데이터를 받아서 처리 -->
   <form action="">
        <!-- 폼 테두리선 -->
        <fieldset>
            <!-- 폼의 이름(폼의 범례) -->
            <legend>로그인폼</legend>
            <ul>
                <li>
                    <label for="id">아이디:</label>
                    <input type="text" placeholder="아이디를 입력해주세요" autofocus required id="id">
                </li>
                <li>
                    <label for="pw">비밀번호:</label>
                    <input type="password" placeholder="비밀번호를 입력해주세요" required id="pw">
                </li>
            </ul>
        </fieldset>
        <!-- 폼안에 있는 data를 서버 데이타베이스에 전송 -->
        <input type="submit" value="로그인">
        <!-- 폼안에 있는 데이터를 초기화할때 사용 -->
        <input type="reset" value="취소">

        <fieldset>
            <legend>나의 개인정보</legend>
            <ul>
                <li>
                    <label for="email">E-mail</label>
                    <input type="email" placeholder="exam@naver.com" id="email">
                </li>
                <li>
                    <label for="contury">국적:</label>
                    <label for="local">내국인</label><input type="radio" name="gender" id="local">
                    <label for="fore">외국인</label><input type="radio" name="gender" id="fore">
                </li>
                <li>
                    <label for="sh">Search:</label>
                    <input type="text" placeholder="web design" disabled id="sh">
                </li>
                <li>
                    <label for="">URL:</label>
                    <input type="url" placeholder="http://">
                </li>
            </ul>
        </fieldset>
        <input type="submit" value="가입하기">
        <input type="reset" value="새로작성">
        
        <fieldset>
            <legend>나의 일정</legend>
            <ul>
                <li>
                    <label for="nb">숫자 입력:</label>
                    <input type="number" value="1" min="1" max="10" id="nb">
                </li>
                <li>
                    <label for="tel">전화번호:</label>
                    <input class="tel" "text" value="010" disabled>
                    <input class="tel" "text" maxlength="4" id="tel">
                    <input class="tel" "text" maxlength="4">
                </li>
                <li>
                    <label for="coding">코딩실력(상,중,하):</label>
                    <input type="range" min="1" max="3" value="1" id="coding">
                </li>
            </ul>
        </fieldset>
        <input type="submit" value="가입하기">
        <input type="reset" value="다시작성">

        <fieldset>
            <legend>예약관리</legend>
            <ul>
                <li>
                    <label for="">예약날짜</label>
                    <input type="date">
                </li>
                <li>
                    <label for="">예약시간</label>
                    <input type="time">
                </li>
                <li>
                    <label for="">예약날짜시간</label>
                    <input type="datetime-local">
                </li>
            </ul>

        </fieldset>
        <input type="submit" value="예약하기">
        <input type="reset" value="취소하기">
        

   </form> 


    <script src="./js/script.js"></script>
</body>
</html>

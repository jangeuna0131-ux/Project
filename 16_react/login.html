<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 실습</title>

   <style>@charset "utf-8";


/* =========================
   기본 설정
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #ffffff;
    font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    color: #333333;
}


/* =========================
   전체 영역
========================= */

.practice {
    width: 750px;
    margin-left: 44px;
    padding-top: 16px;
}


/* 실습 결과 제목 */
.practice-title {
    margin-bottom: 16px;

    font-size: 32px;
    font-weight: 700;
    line-height: 1.3;

    color: #414141;
}


/* =========================
   로그인 큰 박스
========================= */

.login-box {
    width: 750px;
    height: 562px;

    padding-top: 44px;

    border: 1px solid #dddddd;
    border-radius: 8px;

    background-color: #ffffff;
}


/* =========================
   로그인 폼
========================= */

.login-form {
    width: 420px;
    margin: 0 auto;
}


/* 로그인 제목 */
.login-form h2 {
    margin-bottom: 34px;

    text-align: center;

    font-size: 46px;
    font-weight: 700;
    line-height: 1;

    color: #414141;
}


/* 입력 한 묶음 */
.form-group {
    margin-bottom: 20px;
}


/* 아이디 / 비밀번호 글자 */
.form-group label {
    display: block;

    margin-bottom: 10px;

    font-size: 20px;
    font-weight: 400;

    color: #333333;
}


/* 입력칸 */
.form-group input {
    display: block;

    width: 420px;
    height: 68px;

    padding: 0 16px;

    border: 1px solid #cccccc;
    outline: none;

    background-color: #ffffff;

    font-size: 18px;
}


/* 입력칸 클릭 */
.form-group input:focus {
    border-color: #777777;
}


/* =========================
   로그인 버튼
========================= */

.login-form button {
    display: block;

    width: 420px;
    height: 64px;

    margin-top: 28px;

    border: none;

    background-color: #2b2b2b;
    color: #ffffff;

    font-size: 20px;
    font-weight: 700;

    cursor: pointer;
}


/* 버튼에 마우스를 올렸을 때 */
.login-form button:hover {
    background-color: #1f1f1f;
}</style>
</head>

<body>

    <main class="practice">

        <h1 class="practice-title">실습 결과</h1>

        <section class="login-box">

            <form class="login-form" action="#">

                <h2>로그인</h2>

                <div class="form-group">
                    <label for="user-id">아이디</label>
                    <input
                        type="text"
                        id="user-id"
                    >
                </div>

                <div class="form-group">
                    <label for="user-password">비밀번호</label>
                    <input
                        type="password"
                        id="user-password"
                    >
                </div>

                <button type="submit">
                    로그인
                </button>

            </form>

        </section>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA Splash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
        }

        .splash {
            position: relative;

            width: 100%;
            height: 812px;

            overflow: hidden;
            background-color: #ffffff;
        }

        /* 로고 전체를 클릭 가능한 링크로 설정 */
        .splash-link {
            position: absolute;
            top: 50%;
            left: 50%;

            display: block;

            transform: translate(-50%, -50%);
        }

        .splash-logo {
            display: block;

            width: 151px;
            height: auto;
        }
    </style>
</head>

<body>

    <main class="splash">

        <!-- 로고를 클릭해도 온보딩 1로 이동 -->
        <a
            class="splash-link"
            href="./onborading-1.html"
        >
            <img
                class="splash-logo"
                src="./images/logo.svg"
                alt="CAMBA 로고"
            >
        </a>

    </main>

    <!-- 3초 후 온보딩 1로 자동 이동 -->
    <script>
        setTimeout(function () {
            window.location.href = "./onborading-1.html";
        }, 3000);
    </script>

</body>
</html>

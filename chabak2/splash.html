<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA Splash</title>

    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;

            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }

        /* 스플래시 전체 화면 */
        .splash {
            position: relative;

            width: 100%;
            max-width: 375px;
            height: 100dvh;
            max-height: 812px;

            margin: 0 auto;

            overflow: hidden;
            background-color: #ffffff;
        }

        /* 중앙 로고 링크 */
        .splash-link {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1;

            display: block;

            transform: translate(-50%, -50%);
        }

        /* 중앙 로고 */
        .splash-logo {
            display: block;

            width: 151px;
            height: auto;
        }

        /* 하단 시작하기 버튼 */
        .start-button {
            position: absolute;
            right: 24px;
            bottom: 34px;
            left: 24px;
            z-index: 2;

            display: block;
            height: 48px;

            color: #ffffff;
            background-color: #506bb0;
            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;
            line-height: 48px;
            text-align: center;
            text-decoration: none;
        }

        /* 버튼을 누르는 순간 */
        .start-button:active {
            background-color: #435d9e;
        }
    </style>
</head>

<body>

    <main class="splash">

        <!-- 로고를 클릭해도 온보딩 1로 이동 -->
        <a
            class="splash-link"
            href="./on-1.html"
        >
            <img
                class="splash-logo"
                src="./images/logo.svg"
                alt="CAMBA 로고"
            >
        </a>

        <!-- 하단 시작하기 버튼 -->
        <a
            class="start-button"
            href="./on-1.html"
        >
            시작하기
        </a>

    </main>

    <!-- 3초 후 온보딩 1로 자동 이동 -->
    <script>
        setTimeout(function () {
            window.location.href = "./on-1.html";
        }, 3000);
    </script>

</body>
</html>

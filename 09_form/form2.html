<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>응용문제1</title>
    <link rel="stylesheet" href="./css/form2.css">
</head>
<body>
    <fieldset>
        <legend>개인정보</legend>
        <ul>
            <li>
                <label for="class name">이름</label>
                <input type="text" placeholder="이름">
            </li>
            <li><label for="class email">메일주소</label>
                <input type="text" placeholder="메일주소">
            </li>
                
        </ul>
    </fieldset>

    <fieldset>
        <legend>로그인 정보</legend>
        <ul>
            <li>
                <label for="class ID">아이디</label>
                <input type="text" placeholder="아이디">
            </li>
            <li>
                <label for="class password">비밀번호</label>
                <input type="password" placeholder="비밀번호">
            </li>
        </ul>
    </fieldset>


</body>
</html>

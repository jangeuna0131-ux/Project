<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html5form</title>
    <link rel="stylesheet" href="./01_html5from/css/style.css">
</head>
<body>
    <h1>입력 요소의 종류와 속성</h1>
    <form action="">
<fieldset>
    <legend>로그인폼</legend>
    <ul>
        <li>
            <label for="id">아이디;</label>
            <input type="text" placeholder="honggildong" autofocus required id="id" readonly>
        </li>
        <li>
             <label for="">비밀번호</label>
            <input type="password" placeholder="비밀번호를 입력해주세요" required id="pw">
        </li>

    </ul>

</fieldset>
<!-- 폼안에 있는 데이타를 서버 데이타베이스에 전송하는버튼 -->
<input type="submit" value="로그인">
<!-- 폼안에 있는 데이타를 초기화시킬때 사용 -->
<input type="reset" value="취소">


<fieldset>
    <legend>나의 개인정보</legend>
    <ul>
        <li>
            <label for="email">E-mail</label>
            <input type="email" placeholder="exam@naver.com" id="email">
        </li>
        <li>
            <label for="contury">국적:</label>
            <label for="local">내국인</label><input type="radio" name="gender">
            <label for="fore">외국인</label><input type="radio" name="gender">
        </li>
        <li>
            <label for="sh">Searh:</label> 
            <input type="text" placeholder="web design" disabled id="sh">
        </li>
        <li>
            <label for="">URL</label>
            <input type="url" placeholder="http://">
        </li>
    </ul>
</fieldset>
<input type="submit" value="가입하기">
<input type="reset" value="새로작성">

<fieldset>
    <legend>나의 일정</legend>
    <ul>
        <li>
            <label for="">숫자 입력:</label>
            <input type="number" value="1" min="1" max="10" id="nb">
        </li>
        <li>
            <label for="">전화번호:</label>
            <input class="tel" type="text" value="010" disabled>
            <input class="tel" type="text" maxlength="4" id="tel">
            <input class="tel" type="text" maxlength="4">
        </li>
        <li>
            <label for="">코딩실력(상,중,하):</label>
            <input type="range" min="1" max="3" value="1">
        </li>
    </ul>
</fieldset>
<input type="submit" value="가입하기">
<input type="reset" value="다시작성">
      <fieldset>
            <legend>예약관리</legend>
            <ul>
                <li>
                    <label for="">예약날짜</label>
                    <input type="date">
                </li>
                <li>
                    <label for="">예약시간</label>
                    <input type="time">
                </li>
                <li>
                    <label for="">예약날짜시간</label>
                    <input type="datetime-local">
                </li>
            </ul>

        </fieldset>
<input type="submit" value="예약하기">
<input type="reset" value="취소하기">

<fieldset>
    <legend>그래프</legend>
    <ul>
        <li>
            <label for="">좋아하는 색상:</label>
            <input type="color">
        </li>
        <li>
            <label for="prog">진행률70%</label>
            <progress max="100" value="90" id="prog"></progress>
        </li>

        <li><label for="">사용량(50%)</label>
        <meter value="50" max="100"></meter></li>
        <li>
            <label for="cons">상담분야</label>
            <select name="" id="cons">
                <option value="">상담분야를 선택해주세요</option>
                <option value="눈성형">눈성형</option>
                <option value="코성형">코성형</option>
                <option value="지방/윤곽성형">지방/윤곽성형</option>
                <option value="이마성형">이마성형</option>
                <option value="리프팅/동안">리프팅/동안</option>
                <option value="기타">기타</option>
            </select>
        </li>
    </ul>
</fieldset>
<input type="submit" value="가입">
<input type="reset" value="취소">

</form>



    <script src="./01_html5from/js/script.js"></script>
</body>
</html>

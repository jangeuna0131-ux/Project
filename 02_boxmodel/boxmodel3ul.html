<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>순서 없는 목록 박스</title>

    <style>
        /* 브라우저 기본 여백 제거 */
        * {
            margin: 0;
            padding: 0;
        }

        /* 전체 부모 박스 */
        ul {
            width: 1000px;
            height: 300px;

            margin: 0 auto;

            border: 5px solid #000000;

            display: flex;
            gap: 20px;
        }

        /* 노란색 자식 박스 */
        ul li {
            width: 320px;
            height: 300px;

            background-color: #ffff00;

            list-style: none;
        }
    </style>
</head>

<body>

    <ul>
        <li>박스1</li>
        <li>박스2</li>
        <li>박스3</li>
    </ul>

</body>
</html>

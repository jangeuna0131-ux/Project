<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form과 관련된 요소들</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <main class="game-wrap">

        <!-- 제목 -->
        <header class="game-header">
            <p class="game-label">CLASSIC BLOCK GAME</p>
            <h1>TETRIS</h1>
        </header>

        <section class="game-layout">

            <!-- 테트리스 게임 화면 -->
            <div class="board-area">
                <canvas
                    id="gameCanvas"
                    width="300"
                    height="600"
                    aria-label="테트리스 게임 화면"
                ></canvas>

                <!-- 시작 전 / 게임 오버 화면 -->
                <div id="gameOverlay" class="game-overlay">
                    <h2 id="overlayTitle">TETRIS</h2>
                    <p id="overlayText">
                        시작 버튼을 눌러주세요.
                    </p>

                    <button
                        id="overlayStartButton"
                        class="primary-button"
                        type="button"
                    >
                        게임 시작
                    </button>
                </div>
            </div>

            <!-- 게임 정보 -->
            <aside class="game-panel">

                <div class="info-card">
                    <span class="info-title">SCORE</span>
                    <strong id="score">0</strong>
                </div>

                <div class="info-card">
                    <span class="info-title">HIGH SCORE</span>
                    <strong id="highScore">0</strong>
                </div>

                <div class="info-card">
                    <span class="info-title">LEVEL</span>
                    <strong id="level">1</strong>
                </div>

                <div class="info-card">
                    <span class="info-title">LINES</span>
                    <strong id="lines">0</strong>
                </div>

                <div class="next-card">
                    <span class="info-title">NEXT</span>

                    <canvas
                        id="nextCanvas"
                        width="120"
                        height="120"
                        aria-label="다음 블록"
                    ></canvas>
                </div>

                <div class="button-group">
                    <button
                        id="startButton"
                        class="primary-button"
                        type="button"
                    >
                        게임 시작
                    </button>

                    <button
                        id="pauseButton"
                        class="secondary-button"
                        type="button"
                        disabled
                    >
                        일시정지
                    </button>
                </div>

                <div class="keyboard-guide">
                    <h2>조작 방법</h2>

                    <p>
                        <kbd>←</kbd>
                        <kbd>→</kbd>
                        좌우 이동
                    </p>

                    <p>
                        <kbd>↓</kbd>
                        빠르게 내리기
                    </p>

                    <p>
                        <kbd>↑</kbd>
                        블록 회전
                    </p>

                    <p>
                        <kbd>Space</kbd>
                        한 번에 내리기
                    </p>

                    <p>
                        <kbd>P</kbd>
                        일시정지
                    </p>
                </div>

            </aside>
        </section>

        <!-- 모바일 조작 버튼 -->
        <section class="mobile-controls" aria-label="모바일 게임 조작">

            <button
                class="control-button"
                type="button"
                data-action="left"
                aria-label="왼쪽 이동"
            >
                ◀
            </button>

            <button
                class="control-button"
                type="button"
                data-action="rotate"
                aria-label="블록 회전"
            >
                ↻
            </button>

            <button
                class="control-button"
                type="button"
                data-action="right"
                aria-label="오른쪽 이동"
            >
                ▶
            </button>

            <button
                class="control-button"
                type="button"
                data-action="down"
                aria-label="아래로 이동"
            >
                ▼
            </button>

            <button
                class="control-button drop-button"
                type="button"
                data-action="drop"
                aria-label="블록 바로 내리기"
            >
                DROP
            </button>

        </section>

    </main>

    <!-- JavaScript 연결 -->
    <script src="./js/main.js"></script>
</body>
</html>

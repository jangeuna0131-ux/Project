<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form과 관련된 명령</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
 <h1>[폼 구성 요소 알아보기]</h1>
    <form action="">
    <fieldset>
        <legend>로그인폼</legend>
        <ol>
            <li>
                <label for="" class="id">ID</label>
                <input type="text" placeholder="아이디또는전화번호">
            </li>
            <li>
                <label for="">PASSWORD</label>
                <input type="password" placeholder="비밀번호">
            </li>
        </ol>
    </fieldset>
    <fieldset>
        <legend>개인정보</legend>
        <ul>
            <li>
                <input type="radio" name="gender"><label for="">남</label>
                <input type="radio" name="gender" checked><label for="">여</label>
            </li>
            <li>
                <label for="">여백</label>
                <input type="checkbox">
                <label for="">영화</label>
                <input type="checkbox" checked>
                <label for="">독서</label>
                <input type="checkbox">
            </li>
            <li>
                <label for="">칼라선택</label>
               <select name="" id="" multiple>
                <option value="">:::색상을 선택하세요:::</option>
                <option value="">빨간색</option>
                <option value="">녹색</option>
                <option value="">파란색</option>
               </select> 
            </li>
            <li>
                <label for="">메세지:</label>
                <textarea name="" id="" cols="30" rows="10">
                    여기에 입력하세요
                </textarea>
                
            </li>
        </ul>
    </fieldset>

    <fieldset>
        <legend>예약폼</legend>
        <label for="">예약날짜</label>
        <input type="date">
        <label for="">예약시간</label>
        <input type="time">
        <label for="">예약일정</label>
        <input type="datetime-local">
    </fieldset>
    
    <fieldset>
        <legend>파일전송</legend>
            <ul>
                <li>
                    <label for="">파일첨부</label>
                    <input type="file">
                </li>
            </ul>
        
    </fieldset>
    <!-- 서버로 데이터를 전송할때 -->
    <input type="submit" value="가입하기">

    <!-- 초기화 시켜서 다시 작성할때 -->
     <input type="reset" value="다시 작성하기">

    </form>


   <script src="./js/main.js"></script> 
</body>
</html>

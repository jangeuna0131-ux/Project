<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- iOS·안드로이드 모바일 App 전용 설정 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>GAZE 제품 비교</title>

    <style>
        /* =========================
           기본 설정
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100svh;

            overflow: hidden;

            background-color: #f7f4ee;
            color: #1f2a44;

            font-family:
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                "Malgun Gothic",
                sans-serif;

            -webkit-tap-highlight-color: transparent;
        }

        button,
        a {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           제품 비교 전체 화면
        ========================= */
        .compare-page {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100svh;

            overflow: hidden;
            background-color: #f7f4ee;
        }

        /* =========================
           스크롤되는 본문
        ========================= */
        .compare-content {
            width: 100%;
            height: 100%;

            padding:
                max(36px, calc(env(safe-area-inset-top) + 16px))
                24px
                calc(220px + env(safe-area-inset-bottom));

            overflow-y: auto;
            overflow-x: hidden;

            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .compare-content::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           상단 헤더
        ========================= */
        .compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            height: 44px;

            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;

            min-width: 0;
        }

        .back-button,
        .trash-button {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;

            border: 0;
            background-color: transparent;

            cursor: pointer;
        }

        .back-button {
            margin-left: -12px;
        }

        .header-icon {
            display: block;

            width: 24px;
            height: 24px;

            object-fit: contain;
        }

        .page-title {
            margin-left: 4px;

            color: #1f2a44;

            font-size: 18px;
            font-weight: 700;
            line-height: 26px;
            letter-spacing: -0.4px;
        }

        /* =========================
           비교 제품 카드
        ========================= */
        .product-card-area {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            width: 100%;

            gap: 20px;
        }

        .product-card {
            position: relative;

            min-width: 0;
            min-height: 252px;

            padding: 32px 16px 12px;

            border: 1px solid #d8dde5;
            border-radius: 16px;

            background-color: #ffffff;
        }

        /* 개별 제품 제거 표시 */
        .remove-button {
            position: absolute;
            top: 8px;
            right: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            border: 0;
            background-color: transparent;

            cursor: pointer;
        }

        .remove-mark {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background-color: #1f2a44;
            color: #ffffff;

            font-size: 11px;
            font-weight: 700;
            line-height: 14px;
        }

        /* 제품 이미지 */
        .product-image-link {
            display: block;

            width: 100%;
        }

        .product-image-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 136px;

            overflow: hidden;
            background-color: #f7f4ee;
        }

        .product-image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;
        }

        /* 제품 정보 */
        .product-name {
            display: block;

            margin-top: 10px;

            color: #1f2a44;

            font-size: 13px;
            font-weight: 700;
            line-height: 20px;
            letter-spacing: -0.3px;

            word-break: keep-all;
        }

        .product-price {
            margin-top: 4px;

            color: #1f2a44;

            font-size: 14px;
            font-weight: 700;
            line-height: 20px;
        }

        .product-color {
            display: flex;
            align-items: center;

            margin-top: 6px;

            color: #2f3640;

            font-size: 12px;
            font-weight: 400;
            line-height: 18px;
        }

        .color-chip {
            display: block;
            flex-shrink: 0;

            width: 14px;
            height: 14px;

            margin-right: 8px;

            border-radius: 50%;
        }

        .black-chip {
            background-color: #000000;
        }

        .tortoise-chip {
            background-color: #b7a59a;
        }

        /* =========================
           제품 비교표
        ========================= */
        .comparison-table-wrap {
            width: 100%;

            margin-top: 16px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .comparison-table-wrap::-webkit-scrollbar {
            display: none;
        }

        .comparison-table {
            width: 100%;

            border-collapse: collapse;
            table-layout: fixed;

            background-color: #ffffff;
        }

        .comparison-table th,
        .comparison-table td {
            min-height: 36px;

            padding: 8px 4px;

            border: 1px solid #d8dde5;

            color: #2f3640;

            font-size: 11px;
            font-weight: 400;
            line-height: 16px;

            text-align: center;
            vertical-align: middle;

            word-break: keep-all;
        }

        .comparison-table th {
            color: #1f2a44;
            font-weight: 500;
        }

        .comparison-table .table-label {
            width: 33.333%;

            color: #2f3640;
            font-weight: 500;
        }

        /* =========================
           하단 고정 버튼
        ========================= */
        .bottom-actions {
            position: fixed;
            z-index: 20;

            right: 0;
            bottom: 0;
            left: 0;

            width: 100%;

            padding:
                12px
                22px
                calc(12px + env(safe-area-inset-bottom));

            background-color: #f7f4ee;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 56px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;
            line-height: 24px;

            cursor: pointer;
        }

        /* 제품 추가 */
        .add-button {
            border: 1px solid #1f2a44;

            background-color: #ffffff;
            color: #1f2a44;
        }

        /* 매장 찾기 */
        .store-button {
            margin-top: 8px;

            border: 1px solid #1f2a44;

            background-color: #1f2a44;
            color: #ffffff;
        }

        /* 상세보기 */
        .detail-link {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 40px;

            margin-top: 4px;

            color: #1f2a44;

            font-size: 15px;
            font-weight: 700;
            line-height: 22px;
        }

        /* 터치 효과 */
        .action-button:active,
        .detail-link:active,
        .back-button:active,
        .trash-button:active,
        .remove-button:active,
        .product-image-link:active,
        .product-name:active {
            opacity: 0.82;
        }
    </style>
</head>

<body>
    <main class="compare-page">

        <!-- 스크롤되는 제품 비교 본문 -->
        <div class="compare-content">

            <!-- 상단 헤더 -->
            <header class="compare-header">

                <div class="header-left">

                    <!-- 이전 화면으로 이동 -->
                    <button
                        class="back-button"
                        type="button"
                        aria-label="이전 화면"
                        onclick="
                            if (window.history.length > 1) {
                                window.history.back();
                            } else {
                                window.location.href = './product-detail.html';
                            }
                        "
                    >
                        <img
                            class="header-icon"
                            src="./icons/back_previous.svg"
                            alt=""
                        >
                    </button>

                    <h1 class="page-title">
                        제품 비교
                    </h1>

                </div>

                <!-- 전체 삭제 아이콘 -->
                <button
                    class="trash-button"
                    type="button"
                    aria-label="비교 제품 전체 삭제"
                >
                    <img
                        class="header-icon"
                        src="./icons/fe_trash.svg"
                        alt=""
                    >
                </button>

            </header>

            <!-- 비교 제품 카드 -->
            <section
                class="product-card-area"
                aria-label="비교 중인 제품"
            >

                <!-- 첫 번째 제품 -->
                <article class="product-card">

                    <button
                        class="remove-button"
                        type="button"
                        aria-label="슬림 캣아이 프레임 비교에서 제거"
                    >
                        <span class="remove-mark">×</span>
                    </button>

                    <a
                        class="product-image-link"
                        href="./product-detail.html"
                    >
                        <div class="product-image-box">

                            <img
                                class="product-image"
                                src="./images/136_88-5.png"
                                alt="슬림 캣아이 프레임"
                            >

                        </div>
                    </a>

                    <a
                        class="product-name"
                        href="./product-detail.html"
                    >
                        슬림 캣아이 프레임
                    </a>

                    <p class="product-price">
                        ₩ 250,000
                    </p>

                    <p class="product-color">
                        <span class="color-chip black-chip"></span>
                        블랙
                    </p>

                </article>

                <!-- 두 번째 제품 -->
                <article class="product-card">

                    <button
                        class="remove-button"
                        type="button"
                        aria-label="토터스 셸 캣아이 비교에서 제거"
                    >
                        <span class="remove-mark">×</span>
                    </button>

                    <a
                        class="product-image-link"
                        href="./product-detail.html"
                    >
                        <div class="product-image-box">

                            <img
                                class="product-image"
                                src="./images/136_88-6.png"
                                alt="토터스 셸 캣아이"
                            >

                        </div>
                    </a>

                    <a
                        class="product-name"
                        href="./product-detail.html"
                    >
                        토터스 셸 캣아이
                    </a>

                    <p class="product-price">
                        ₩ 279,000
                    </p>

                    <p class="product-color">
                        <span class="color-chip tortoise-chip"></span>
                        토터스
                    </p>

                </article>

            </section>

            <!-- 제품 비교표 -->
            <div class="comparison-table-wrap">

                <table class="comparison-table">

                    <thead>
                        <tr>
                            <th class="table-label">
                                비교 항목
                            </th>

                            <th>
                                슬림 캣아이 프레임
                            </th>

                            <th>
                                토터스 셸 캣아이
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th class="table-label">
                                프레임 형태
                            </th>

                            <td>
                                슬림 캣아이
                            </td>

                            <td>
                                캣아이
                            </td>
                        </tr>

                        <tr>
                            <th class="table-label">
                                컬러
                            </th>

                            <td>
                                블랙
                            </td>

                            <td>
                                토터스
                            </td>
                        </tr>

                        <tr>
                            <th class="table-label">
                                소재
                            </th>

                            <td>
                                아세테이트
                            </td>

                            <td>
                                아세테이트
                            </td>
                        </tr>

                        <tr>
                            <th class="table-label">
                                사이즈
                            </th>

                            <td>
                                M / 52-18-145
                            </td>

                            <td>
                                M / 54-18-145
                            </td>
                        </tr>

                        <tr>
                            <th class="table-label">
                                추천 얼굴형
                            </th>

                            <td>
                                타원형, 각진형
                            </td>

                            <td>
                                타원형, 각진형
                            </td>
                        </tr>

                        <tr>
                            <th class="table-label">
                                착용 목적
                            </th>

                            <td>
                                패션·포인트
                            </td>

                            <td>
                                일상·패션
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

        <!-- 하단 고정 버튼 -->
        <nav
            class="bottom-actions"
            aria-label="제품 비교 메뉴"
        >

            <!-- 다른 제품을 추가하러 탐색 화면으로 이동 -->
           <a class="action-button add-button" href="./products.html">
    제품 추가
</a>

            <!-- 매장 찾기 화면 -->
            <a
                class="action-button store-button"
                href="./store-finder.html"
            >
                매장 찾기
            </a>

            <!-- 현재 제품 상세 화면 -->
            <a
                class="detail-link"
                href="./product-detail.html"
            >
                상세보기
            </a>

        </nav>

    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title> <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>position명령 익히기</h1>
    <p>position은 공중에 띄어서 요소를 배치하는 명령</p>
    <ol>
        <li>static ->공중에 띄운 요소 해제(취소)</li>
        <li>relative ->상대적인 기준을 설정</li>
        <li>absolute -> 공중에서 띄어서 원하는 위치에 배치(웹브라우저기준)</li>
        <li>fixed -> 공중에 띄어서 고정으로 배치할때</li>
        <li>배치할때 사용하는 명령 left,top,rigth,bottom</li>
        <li>z-index -> 공중에 띄운 요소끼리 레이어 순서 바꿀때 </li>

    </ol>   
    <hr>
    <div class="box1">box1</div>
    <div class="box2">
        <div class="chid1">chid1</div>
        <div class="chid2">chid2</div>
    </div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
    <div class="ai">
        <img src="./images/RubiconLogo.gif" alt="al로고">
    </div>

</body>
</html>

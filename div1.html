<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스만드는태그</title>
    <style>
        /*여백 초기화작업 */
        *{padding: 0;margin: 0;}
        /* 박스 프레임 */
        div{
            /*가로사이즈 */
            width: 540px;
             /*테두리선의 두깨 */
            border-width: 5px; 
            /*테두리선의 색상 */
            border: color #808080;
             /*테두리선의 종류 */
            border-style: solid;
             /*바깥쪽 아래 여백 */
            padding: 42px 16px 32px 16px;
        }
        h2{
            margin-bottom: 27px;
        }

    </style>
</head>
<body>
    <div>
        <h2>Who am I?</h2>
        <p>
        프런트엔드 웹 기술(Front-end Web Tech.)에 관심이 많습니다.<br>
        현재 제주의 한 시골 마을에서 코딩 중입니다.
    </p>
    </div>
</body>
</html>

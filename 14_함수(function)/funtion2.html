<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // 함수의 매개변수
        // 함수를 사용하지 않고 코딩

        document.write("홍길동님 환영합니다<br>")
        document.write("김철수님 환영합니다<br>")
        document.write("오영희님 환영합니다<br>")
        document.write("조진갑님 환영합니다<br>")
    </script>

    <script>
        // 환영하는 기능의 함수를 선언
        // 함수를 쓰는 목적: 반복되는 코드를 줄이기 위해

        function name(irum){
           document.write(irum + "님 환영합니다<br>")
        }

        name("홍길동")
        name("김철수")
        name("오영희")
        name("조진값")
    </script>

</body>
</html>

<script>
    // 신입사원 입사점수를 외부로부터 입력받아
    // 90점 이상이면 기획부
    // 80점 이상이면 총무부
    // 나머지는 영업부

    let jumsu = prompt("입사점수를 입력하세요?");

    if (jumsu >= 90) {
        alert("발령부서: 기획부");
    } else if (jumsu >= 80) {
        alert("발령부서: 총무부");
    } else {
        alert("발령부서: 영업부");
    }
</script>

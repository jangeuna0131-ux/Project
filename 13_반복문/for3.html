<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">출생월</label>

    <script>
        let output = "<select>";

        for (let i = 1; i <= 12; i++) {
            output = output + "<option>" + i + "월" + "</option>";
        }

        output = output + "</select>";

        document.write(output);
    </script>
    <label for="">출생일</label>
    <script>
        let output2 = "<select>"
            for(let j=1;j<=31;j++){
               output2 = output2 + "<option>" + j + "일" + "</option>"
            }
             output2 = output2 + "</select>"
             document.write(output2)
    </script>

    <label for="">출생년도</label>
    <script>
        let output3 = "<select>"
        for(let k=2026;k>=1900;k--){
          output3 = output3 +  "<option>" + k + "년도" + "</option>"
        }
         output3 = output3 + "</select>"
         document.write(output3)



    </script>
</body>
</html>

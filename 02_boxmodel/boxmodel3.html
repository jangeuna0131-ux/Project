<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델3</title>
    <style>
        /* 여백 초기화 */
        *{margin: 0; padding: 0;}
        .box{
            width: 1000px;
            height: 300px;
            border: 5px solid black;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        .box div{
            width: 320px;
            height: 300px;
            background-color: #ffff00;
        }

        /*순서없는 목록을 이용하여 디자인*/
        ul{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            margin: 0 auto;
            display: flex;
            gap: 20px;

        }
        ul li{
            list-style: none;
            width: 320px;
            height: 300px;
            background-color: #ffff00;
        }
    </style>
</head>
<body>
    <!--div 태그를 사용해서 박스모델 구현-->
    <div class="box">
        <div>박스1</div>
        <div>박스2</div>
        <div>박스3</div>
    </div>

    <!-- ul->li 순서없는 목록을 사용하여 구현 -->
     <ul>
        <li>박스1</li>
        <li>박스2</li>
        <li>박스3</li>
     </ul>

    <script>

    </script>
</body>
</html>

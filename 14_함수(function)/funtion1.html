<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 안녕하세요를 경고창에 보여주는 함수 -->

    <script>
        // 함수를 만든다, 선언한다
        function hello() {
            alert("안녕하세요!")
        }

        // 만들어진 함수를 호출한다
        hello()
        hello()
    </script>

</body>
</html>

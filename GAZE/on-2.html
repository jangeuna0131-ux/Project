<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 App 전용 설정 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>GAZE Onboarding 2</title>

    <style>
        /* 기본 여백 제거 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;

            /* iOS 글자 자동 확대 방지 */
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100svh;

            overflow: hidden;

            background-color: #f7f4ee;
            color: #1f2a44;

            font-family:
                "Noto Sans KR",
                "Apple SD Gothic Neo",
                "Malgun Gothic",
                sans-serif;

            -webkit-tap-highlight-color: transparent;
        }

        /* 모바일 App 전용 온보딩 화면 */
        .onboarding {
            position: relative;

            width: 100%;
            height: 100svh;

            overflow: hidden;
            background-color: #f7f4ee;
        }

        /* 제품 비교 카드 영역 */
        .compare-area {
            position: absolute;
            top: calc(102px + env(safe-area-inset-top));
            right: 24px;
            left: 24px;

            display: flex;

            gap: 20px;
        }

        /* 제품 카드 */
        .product-card {
            flex: 1;
            min-width: 0;
            height: 336px;

            padding: 16px;

            border: 1px solid #d8dde5;
            border-radius: 16px;

            background-color: #ffffff;
        }

        /* BEST MATCH 배지 */
        .best-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 28px;
            padding: 0 8px;

            border-radius: 4px;

            background-color: #7d91b2;
            color: #ffffff;

            font-size: 13px;
            font-weight: 700;
            line-height: 20px;

            white-space: nowrap;
        }

        /* 선글라스 이미지 영역 */
        .product-image-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 112px;

            margin-top: 16px;
        }

        .product-image {
            display: block;

            width: 100%;
            max-width: 124px;
            height: 100%;

            object-fit: contain;
            object-position: center;
        }

        /* 제품 이미지 아래 구분선 */
        .product-line {
            width: 100%;
            height: 1px;

            margin-top: 4px;

            border: 0;
            background-color: #d8dde5;
        }

        /* 제품명 */
        .product-name {
            margin-top: 12px;

            color: #1f2a44;

            font-size: 14px;
            font-weight: 700;
            line-height: 20px;

            white-space: nowrap;
        }

        /* 가격 */
        .product-price {
            margin-top: 6px;

            color: #1f2a44;

            font-size: 14px;
            font-weight: 700;
            line-height: 20px;
        }

        /* 소재와 사이즈 */
        .product-info {
            margin-top: 6px;

            color: #2f3640;

            font-size: 13px;
            font-weight: 400;
            line-height: 18px;

            white-space: nowrap;
        }

        .product-info + .product-info {
            margin-top: 4px;
        }

        /* 컬러칩 영역 */
        .color-list {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-top: 6px;
        }

        /* 컬러칩은 이미지가 아니라 CSS 원 */
        .color-dot {
            display: block;
            flex-shrink: 0;

            width: 12px;
            height: 12px;

            border-radius: 50%;
        }

        .color-dot.navy {
            background-color: #1f2a44;
        }

        .color-dot.taupe {
            background-color: #b7a59a;
        }

        .color-dot.sage {
            background-color: #aeb9b1;
        }

        /* 온보딩 설명 영역 */
        .onboarding-text {
            position: absolute;
            top: calc(492px + env(safe-area-inset-top));
            right: 24px;
            left: 24px;

            text-align: center;
        }

        .onboarding-title {
            color: #1f2a44;

            font-size: 22px;
            font-weight: 700;
            line-height: 30px;
            letter-spacing: -0.8px;
        }

        .onboarding-description {
            margin-top: 12px;

            color: #2f3640;

            font-size: 15px;
            font-weight: 500;
            line-height: 22px;
            letter-spacing: -0.4px;

            word-break: keep-all;
        }

        /* 페이지 표시 점 */
        .pagination {
            position: absolute;
            top: calc(646px + env(safe-area-inset-top));
            left: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 28px;

            transform: translateX(-50%);
        }

        .pagination-dot {
            display: block;

            width: 10px;
            height: 10px;

            border-radius: 50%;
            background-color: #cbd2dc;
        }

        /* 두 번째 페이지 활성화 */
        .pagination-dot.active {
            background-color: #1f2a44;
        }

        /* 하단 버튼 영역 */
        .button-area {
            position: absolute;
            right: 24px;
            bottom: max(36px, env(safe-area-inset-bottom));
            left: 24px;

            display: flex;

            gap: 10px;
        }

        .onboarding-button {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;

            height: 56px;

            border-radius: 12px;

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            line-height: 24px;

            text-decoration: none;
        }

        /* 이전 버튼 */
        .previous-button {
            border: 1px solid #1f2a44;

            background-color: #ffffff;
            color: #1f2a44;
        }

        /* 다음 버튼 */
        .next-button {
            border: 1px solid #1f2a44;

            background-color: #1f2a44;
            color: #ffffff;
        }

        .onboarding-button:active {
            opacity: 0.88;
        }
    </style>
</head>

<body>
    <main class="onboarding">

        <!-- 제품 비교 카드 -->
        <section class="compare-area">

            <!-- 첫 번째 제품 -->
            <article class="product-card">

                <span class="best-badge">
                    BEST MATCH
                </span>

                <div class="product-image-box">

                    <!-- 현재 화면에서 사진이 반대로 보여 파일 순서를 교체함 -->
                    <img
                        class="product-image"
                        src="./images/2_sunglasses.png"
                        alt="라운드 프레임 선글라스"
                    >

                </div>

                <hr class="product-line">

                <h2 class="product-name">
                    ROUND FRAME
                </h2>

                <p class="product-price">
                    ₩219,000
                </p>

                <p class="product-info">
                    아세테이트
                </p>

                <p class="product-info">
                    중간 사이즈
                </p>

                <div
                    class="color-list"
                    aria-label="라운드 프레임 색상"
                >
                    <span class="color-dot navy"></span>
                    <span class="color-dot taupe"></span>
                    <span class="color-dot sage"></span>
                </div>

            </article>

            <!-- 두 번째 제품 -->
            <article class="product-card">

                <span class="best-badge">
                    BEST MATCH
                </span>

                <div class="product-image-box">

                    <img
                        class="product-image"
                        src="./images/1_sunglasses.png"
                        alt="캣아이 프레임 선글라스"
                    >

                </div>

                <hr class="product-line">

                <h2 class="product-name">
                    CAT-FRAME
                </h2>

                <p class="product-price">
                    ₩199,000
                </p>

                <p class="product-info">
                    티타늄
                </p>

                <p class="product-info">
                    작은 사이즈
                </p>

                <div
                    class="color-list"
                    aria-label="캣아이 프레임 색상"
                >
                    <span class="color-dot navy"></span>
                    <span class="color-dot taupe"></span>
                    <span class="color-dot sage"></span>
                </div>

            </article>

        </section>

        <!-- 온보딩 설명 -->
        <section class="onboarding-text">

            <h1 class="onboarding-title">
                차이를 한눈에 비교
            </h1>

            <p class="onboarding-description">
                가격, 프레임 형태, 소재, 사이즈를<br>
                같은 기준으로 비교해요.
            </p>

        </section>

        <!-- 현재 페이지 표시 -->
        <div
            class="pagination"
            aria-label="온보딩 진행 상태"
        >
            <span class="pagination-dot"></span>
            <span class="pagination-dot active"></span>
            <span class="pagination-dot"></span>
        </div>

        <!-- 이전·다음 버튼 -->
        <nav class="button-area">

            <a
                href="on-1.html"
                class="onboarding-button previous-button"
            >
                이전
            </a>

            <a
                href="on-3.html"
                class="onboarding-button next-button"
            >
                다음
            </a>

        </nav>

    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Menu</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="../01_backgroundimage/css/styleai.css">
</head>

<body>

    <section class="quick-menu">
        <div class="inner">

            <!-- 예약하기 -->
            <a href="#" class="quick-item reserve">
                <div class="quick-text">
                    <h2>RESERVE</h2>
                    <p>예약하기</p>
                    <span class="arrow">⟶</span>
                </div>
            </a>

            <!-- 사후 적립 -->
            <a href="#" class="quick-item point">
                <div class="quick-text">
                    <h2>SAVE POINT</h2>
                    <p>사후 적립</p>
                    <span class="arrow">⟶</span>
                </div>
            </a>

            <!-- 딜리버리 -->
            <a href="#" class="quick-item delivery">
                <div class="quick-text">
                    <h2>DELIVERY</h2>
                    <p>딜리버리</p>
                    <span class="arrow">⟶</span>
                </div>
            </a>

        </div>
    </section>

</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>설화수 추천</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- CSS 연결 -->
    <link rel="stylesheet"
          href="./css/style.css">
</head>

<body>

    <!-- ========================================
         설화수 추천 슬라이드 SECTION
    ======================================== -->
    <section class="recommend">

        <div class="inner">

            <!-- 섹션 제목 -->
            <h2>설화수 추천</h2>

            <!-- ========================================
                 Swiper Slide
            ======================================== -->
            <div class="swiper recommend-swiper">

                <div class="swiper-wrapper">

                    <!-- 1. 탄력크림 EX -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img01"></div>

                            <div class="product-text">
                                <h3>탄력크림 EX</h3>

                                <p>
                                    Essential Firming Cream EX
                                </p>

                                <strong>
                                    100,000원
                                </strong>
                            </div>

                        </div>

                    </div>


                    <!-- 2. 자정기미코렉터 -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img02"></div>

                            <div class="product-text">
                                <h3>자정기미코렉터</h3>

                                <p>
                                    Lumiwise Discoloration Corrector
                                </p>

                                <strong>
                                    150,000원
                                </strong>
                            </div>

                        </div>

                    </div>


                    <!-- 3. 퍼펙팅 쿠션 에어리 -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img03"></div>

                            <div class="product-text">
                                <h3>퍼펙팅 쿠션 에어리</h3>

                                <p>
                                    Perfecting Cushion Airy
                                </p>

                                <strong>
                                    89,000원
                                </strong>
                            </div>

                        </div>

                    </div>


                    <!-- 4. 윤조아이세럼 -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img04"></div>

                            <div class="product-text">
                                <h3>윤조아이세럼</h3>

                                <p>
                                    First Care Activating Eye Serum
                                </p>

                                <strong>
                                    115,000원
                                </strong>
                            </div>

                        </div>

                    </div>


                    <!-- 5. 여윤팩 -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img05"></div>

                            <div class="product-text">
                                <h3>여윤팩</h3>

                                <p>
                                    Overnight Recharging Mask
                                </p>

                                <strong>
                                    70,000원
                                </strong>
                            </div>

                        </div>

                    </div>


                    <!-- 6. 순행클렌징폼 -->
                    <div class="swiper-slide">

                        <div class="product-card">

                            <div class="product-img product-img06"></div>

                            <div class="product-text">
                                <h3>순행클렌징폼</h3>

                                <p>
                                    Gentle Cleansing Foam
                                </p>

                                <strong>
                                    67,000원
                                </strong>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- ========================================
                     좌우 슬라이드 버튼
                ======================================== -->

                <!-- 이전 버튼 -->
                <button class="swiper-button-prev recommend-prev"
                        type="button"
                        aria-label="이전 슬라이드">
                </button>

                <!-- 다음 버튼 -->
                <button class="swiper-button-next recommend-next"
                        type="button"
                        aria-label="다음 슬라이드">
                </button>

            </div>


            <!-- ========================================
                 진행 막대 + 정지/재생 버튼
            ======================================== -->
            <div class="pagination-container">

                <div class="pagination-container__inner">

                    <!-- 진행 막대 -->
                    <div class="swiper-pagination recommend-swiper-pagination">
                    </div>

                    <!-- 정지 / 재생 버튼 -->
                    <button class="control-btn recommend-control-btn"
                            type="button"
                            aria-label="슬라이드 정지">

                        <span class="blind">
                            슬라이드 정지
                        </span>

                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- JS 연결 -->
    <script src="./js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 함수를 사용하지 않을 경우
        for(let i=1; i<=3; i++){
            document.write("저의 직업은 웹디자이너 입니다<br>")
        }

        for(let j=1; j<=5; j++){
            document.write("저의 직업은 웹퍼블리셔 입니다<br>")
        }

        for(let k=1; k<=7; k++){
            document.write("저의 직업은 프런트엔드 개발자 입니다<br>")
        }

        document.write("<hr>")

        // 함수를 만들어서 사용
        function job(web, count) {
            for(let m=1; m<=count; m++){
                document.write("저의 직업은 " + web + " 입니다<br>")
            }
        }

        // 함수를 호출하여 사용
        job("웹디자이너", 3)
        job("웹퍼블리셔", 5)
        job("프런트엔드",7)
    </script>
</body>
</html>

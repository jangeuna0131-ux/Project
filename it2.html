<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //외부로 부터 데이터를 입력받아서
    // 해당 데이터가 80점 이상이면 합격 
    // 그렇지 않으면 불합격 
    let score = prompt("점수를 입력하세요?")
    if(score>=80){
        alert("합격")
    }else{
        alert("불합격")
    }


    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div&span태그응용</title>
    <style>
        *{margin: 0; padding: 0;}
        div{width: 640px;
        padding: 42px 15px 16px;
        border: 2px solid #fe0000;
    margin: 0 auto;}
        div h1{
            background-color: #ffff00;
            text-align: center;
            padding: 16px 0;
            margin-bottom: 24px;
        }
        div .p1{
            color: #0451ff;
        font-size: 20px;
    margin-bottom: 21px;}

        div .p2{
            font-size: 21px;
            font-weight: 600;
             margin-bottom: 21px;
        }

        div h2{
            background-color:#d3d3d3 ;
            text-align: center;
            padding: 16px 0;
            font-weight: 500;
            margin-bottom: 24px;
        }

        ul{margin-left: 42px;
        margin-bottom: 42px;}

       div .p3{font-size: 13px;
        font-weight: 700px;
    margin-bottom: 45px;}

    div p span{background-color: #7f0081;
        color: #ffffff;
        padding: 6px;}
    </style>
</head><body>
<div>
    <h1>한국 영재 올림피아드</h1>
    <p class="p1">한국 영제 올림피아드(korea Olympiad for the Gifted Studentes)는···</p>
    <p class="p2">(↑클릭하면 자세한 설명으로 이동합니다.)</p>
    <h2>대회 개요</h2>
    <ul>
        <li>대회일시</li>
        <li>대회일시</li>
        <li>대회일시</li>
    </ul>
    <p class="p3">

    </p>
    <p class="p3">과학에 관심있고 재능있는 여러분들의 도전을 응원하겠습니다!!!</p>
<p>
    <span>이벤트</span>

</div>

</html>

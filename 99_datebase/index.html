<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>폼데이터베이스</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="formbox">

        <form name="submit-to-google-sheet">

            <input
                type="text"
                name="Name"
                placeholder="이름을 입력하세요"
            >

            <input
                type="email"
                name="Email"
                placeholder="이메일을 입력하세요"
            >

            <textarea
                name="Message"
                rows="6"
                placeholder="메세지를 입력하세요"
            ></textarea>

            <input
                type="submit"
                value="Submit"
                class="btn"
            >

        </form>

        <!-- 전송 상황 메시지를 보여주는 요소 -->
        <span id="msg"></span>

    </div>

    <script src="./js/script.js"></script>

</body>

</html>

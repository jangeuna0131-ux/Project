<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 App 전용 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 온보딩 01</title>

    <style>
        /* =========================
           기본 초기화
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;

            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }

        /* =========================
           모바일 앱 전체 화면
        ========================= */

        .onboarding {
            position: relative;

            width: 100%;
            height: 812px;

            overflow: hidden;
            background-color: #ffffff;
        }

        /* =========================
           상단 텍스트 영역
        ========================= */

        .text-area {
            position: absolute;
            top: 102px;
            left: 24px;
            z-index: 2;

            width: calc(100% - 48px);
        }

        .title {
            color: #384b7b;
            font-weight: 700;
            letter-spacing: -1.2px;
        }

        .title-top {
            display: block;

            font-size: 30px;
            line-height: 36px;
        }

        .title-bottom {
            display: flex;
            align-items: baseline;
            gap: 8px;

            margin-top: 4px;
            white-space: nowrap;
        }

        .title-main {
            color: #384b7b;

            font-size: 30px;
            font-weight: 700;
            line-height: 36px;
        }

        .title-sub {
            color: #6e84bd;

            font-size: 23px;
            font-weight: 700;
            line-height: 30px;
            letter-spacing: -1px;
        }

        .description {
            margin-top: 18px;

            color: #9aa9d1;

            font-size: 18px;
            font-weight: 500;
            line-height: 24px;
            letter-spacing: -0.7px;

            word-break: keep-all;
        }

        .description-line {
            display: block;
            white-space: nowrap;
        }

        /* =========================
           메인 일러스트
        ========================= */

        .visual-area {
            position: absolute;
            top: 349px;
            left: 0;
            z-index: 1;

            width: 100%;
            height: 283px;

            overflow: hidden;
        }

        .visual-image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: fill;
        }

        /* =========================
           페이지 표시 점
        ========================= */

        .pagination {
            position: absolute;
            top: 664px;
            left: 50%;
            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;

            transform: translateX(-50%);
        }

        .pagination-dot {
            display: block;

            width: 10px;
            height: 10px;

            background-color: #eef0f7;
            border-radius: 50%;
        }

        .pagination-dot.active {
            background-color: #506bb0;
        }

        /* =========================
           시작하기 버튼
        ========================= */

        .start-button {
            position: absolute;
            bottom: 34px;
            left: 24px;
            z-index: 4;

            display: block;

            width: calc(100% - 48px);
            height: 48px;

            color: #ffffff;
            background-color: #506bb0;
            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;
            line-height: 48px;
            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        .start-button:active {
            background-color: #435d9e;
        }
    </style>
</head>

<body>

    <main class="onboarding">

        <!-- 상단 문구 -->
        <section class="text-area">

            <h1 class="title">

                <span class="title-top">
                    차박
                </span>

                <span class="title-bottom">

                    <span class="title-main">
                        어디로
                    </span>

                    <span class="title-sub">
                        떠나야 할지 모르겠나요
                    </span>

                </span>

            </h1>

            <p class="description">

                <span class="description-line">
                    지도기반 위치 앱 및 키워드 검색으로 내가 원
                </span>

                <span class="description-line">
                    하는 장소를 한번에
                </span>

            </p>

        </section>

        <!-- 곰 캐릭터 일러스트 -->
        <div class="visual-area">

            <img
                class="visual-image"
                src="./images/work1ill.svg"
                alt="휴대폰으로 차박 장소를 찾는 곰 캐릭터"
            >

        </div>

        <!-- 온보딩 페이지 표시 -->
        <div
            class="pagination"
            aria-label="전체 3페이지 중 1페이지"
        >
            <span class="pagination-dot active"></span>
            <span class="pagination-dot"></span>
            <span class="pagination-dot"></span>
        </div>

        <!-- 클릭하면 온보딩 2로 이동 -->
        <a
            href="./onborading-2.html"
            class="start-button"
            id="startButton"
        >
            시작하기
        </a>

    </main>

    <!-- 3초 후 온보딩 2로 자동 이동 -->
    <script>
        const startButton = document.getElementById("startButton");

        const autoMove = setTimeout(function () {
            window.location.href = "./onborading-2.html";
        }, 3000);

        startButton.addEventListener("click", function () {
            clearTimeout(autoMove);
        });
    </script>

</body>
</html>
